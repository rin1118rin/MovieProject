<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ログイン | O-HARAFILM</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <a class="skip" href="#main">本文へ移動</a>
  <!-- 管理者画面の共通ヘッダー -->
  <!-- HTMLだけで共通ファイルを表示します。見た目はstyle.cssで設定。 -->
  <iframe class="common-frame header-frame" src="admin-header.html" title="共通ヘッダー・メニュー"></iframe>
  <main class="container" id="main">
    <p class="breadcrumb"><a href="admin-index.html">管理者メインメニュー</a> / 管理者ログイン</p>
    <div class="page-title"><div><h1>ログイン</h1></div></div>
    
    <section class="panel narrow"><h2>管理システムにログイン</h2><!-- name属性を省略し、入力値をURLに含めず遷移します。 -->
<form action="admin-index.html" method="get"><label for="email">管理者ID</label><input id="email" type="email" required autocomplete="username"><label for="password">パスワード</label><input id="password" type="password" required autocomplete="current-password"><div class="actions"><button class="button" type="submit">ログイン</button><a class="button secondary" href="index.html">戻る</a></div></form><a class="button secondary" href="admin-register.html">管理者登録へ</a></section>
  </main>
  <!-- HTMLだけで共通ファイルを表示します。見た目はstyle.cssで設定。 -->
  <iframe class="common-frame footer-frame" src="admin-footer.html" title="共通フッター"></iframe>
</body>
</html>
